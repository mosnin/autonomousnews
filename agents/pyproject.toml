[project]
name = "technotimes-agents"
version = "0.1.0"
description = "Autonomous news pipeline for Techno Times — runs on Modal, uses the OpenAI Agents SDK."
requires-python = ">=3.11"
dependencies = [
    "modal>=0.64",
    "openai>=1.50",
    "openai-agents>=0.0.4",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["technotimes_agents"]
